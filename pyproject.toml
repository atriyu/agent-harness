[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Agentic QA harness for VPN & L4-L7 networking products"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pymupdf>=1.24",
    "markdownify>=0.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
networking = [
    "scapy>=2.5",
    "iperf3>=0.1",
    "netmiko>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "pytest-json-report>=1.5",
    "ruff>=0.5",
]

[project.scripts]
agent-harness = "src.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
