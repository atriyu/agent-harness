harness:
  name: "VPN & L4-L7 QA Harness"
  output_dir: "./generated"
  log_level: "INFO"
  max_parallel_agents: 4

skills:
  skills_dir: "./skills"
  product: null
  auto_generate_api_skills: true
  max_skill_tokens_per_agent: 8000

inputs:
  docs_dir: "./docs/input"
  accepted_formats: ["pdf", "md", "html"]

models:
  provider: "anthropic"
  api_key_env: "ANTHROPIC_API_KEY"

  tiers:
    haiku:
      id: "claude-haiku-4-5-20241022"
      max_tokens: 4096
      cost_per_1k_input: 0.001
      cost_per_1k_output: 0.005
    sonnet:
      id: "claude-sonnet-4-5-20250929"
      max_tokens: 8192
      cost_per_1k_input: 0.003
      cost_per_1k_output: 0.015
    opus:
      id: "claude-opus-4-0-20250514"
      max_tokens: 16384
      cost_per_1k_input: 0.015
      cost_per_1k_output: 0.075

  routing:
    document_parsing: haiku
    requirement_extraction: sonnet
    test_plan_generation: opus
    test_code_generation: sonnet
    failure_classification: haiku
    root_cause_analysis: opus
    report_summary: haiku
    test_repair: sonnet
    gap_analysis: sonnet
    api_enhancement: sonnet

  cascade_on_validation_failure: true
  max_cascade_depth: 2

  budget:
    max_cost_usd: 50.00
    warn_at_pct: 80

gap_analysis:
  enabled: true
  policy: configurable
  critical_action: pause
  minor_action: continue

topology:
  provider: "containerlab"
  default_topology: "full_stack"
  topologies_dir: "./config/topologies"
  keep_alive_after_run: false
  health_check_timeout_seconds: 120

execution:
  framework: "pytest"
  timeout_per_test_seconds: 300
  parallel_workers: 4
  retry_flaky: 1
  collect_pcaps: true
  collect_container_logs: true

repair:
  enabled: true
  max_attempts_per_test: 2

reporting:
  formats: ["html", "markdown"]
  include_logs: true
  include_pcaps: false
  performance_charts: true
